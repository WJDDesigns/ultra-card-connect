name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check version alignment
        run: npm run version:check

      - name: Build and validate integration
        run: node build.js

      - name: Verify documentation bundle
        run: npm run docs:check

      - name: Verify panel bundle hashes
        run: npm run panel:check

      - name: Check for debug telemetry in shipped panel assets
        run: |
          if grep -rq '127\.0\.0\.1:7242' custom_components/ultra_card_pro_cloud/www; then
            echo "::warning::Debug localhost telemetry found in www/ — rebuild the panel from Ultra Card without debug instrumentation"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Lint Python integration
        run: ruff check custom_components/ultra_card_pro_cloud/ tests/

  ha-tests:
    # Request-count tests against a real Home Assistant core: they guard the
    # ultracard.io sign-in limit and the users/me cost (see CLAUDE.md).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Home Assistant test harness
        run: pip install -r requirements-test-ha.txt

      - name: Run Home Assistant tests
        run: pytest tests/ha -q
