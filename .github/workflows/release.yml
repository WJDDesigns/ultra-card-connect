name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
        with:
          path: "."

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check version alignment
        run: npm run version:check

      - name: Verify documentation bundle
        run: npm run docs:check

      - name: Verify panel bundle hashes
        run: npm run panel:check

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./custom_components/ultra_card_pro_cloud/manifest.json').version")
          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "Tag v${TAG_VERSION} does not match manifest.json ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Build release package
        run: node build.js --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultra-card-connect-release
          path: release/*.zip

  release:
    needs: [hacs, hassfest, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ultra-card-connect-release
          path: release

      - name: Build release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the "## [VERSION]" section (everything up to the next "## " heading).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "No CHANGELOG.md section found for ${VERSION}; falling back to a link."
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' "${{ github.repository }}" > release/notes.md
          fi
          cat >> release/notes.md <<'EOF'

          ### Installation

          **Via HACS (Recommended):**
          1. Open HACS in Home Assistant
          2. Search for "Ultra Card Connect"
          3. Click Download
          4. Restart Home Assistant

          **Manual Installation:**
          1. Download the release zip attached to this release
          2. Extract `ultra_card_pro_cloud` into your Home Assistant `config/custom_components/` directory
          3. Restart Home Assistant
          EOF
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: What's New in ${{ steps.notes.outputs.version }}
          generate_release_notes: false
          files: release/*.zip
          body_path: release/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
